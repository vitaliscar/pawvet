# PAWVET — Producción en Hetzner VPS
# Uso: docker compose --env-file ../backend/.env up -d
services:
  api:
    build:
      context: ../backend
    container_name: pawvet-api
    restart: unless-stopped
    env_file:
      - ../backend/.env
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - pawvet

  web:
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
    container_name: pawvet-web
    restart: unless-stopped
    env_file:
      - ../frontend-web/.env.production
    expose:
      - "3000"
    networks:
      - pawvet

  nginx:
    image: nginx:1.27-alpine
    container_name: pawvet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/pawvet.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    networks:
      - pawvet

networks:
  pawvet:
    driver: bridge
