# PAWVET — Nginx reverse proxy (detrás de Cloudflare)

server {
    listen 80;
    server_name pawvet.net www.pawvet.net api.pawvet.net;
    return 301 https://$host$request_uri;
}

# API
server {
    listen 443 ssl;
    http2 on;
    server_name api.pawvet.net;

    ssl_certificate     /etc/letsencrypt/live/pawvet.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pawvet.net/privkey.pem;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# Web (admin + landing)
server {
    listen 443 ssl;
    http2 on;
    server_name pawvet.net www.pawvet.net;

    ssl_certificate     /etc/letsencrypt/live/pawvet.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pawvet.net/privkey.pem;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
